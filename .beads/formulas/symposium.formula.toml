# Symposium Molecule Formula
#
# A multi-phase philosophical discourse workflow for New Atlantis.
# Adapted from Gas Town workflow patterns for scholarly work.
#
# Usage:
#   bd cook symposium
#   bd mol pour symposium --var topic="Excellence and Quality Standards"

description = """
Symposium Molecule: 10-phase philosophical discourse workflow.

Coordinates scholars, critics, and synthesizers through structured
intellectual discourse from independent work through synthesis.

## Phases
1. **independent-work**: Scholars write essays independently
2. **independent-review**: Critics assess all works
3. **independent-revision**: Scholars respond to reviews
4. **cross-review**: Critics compare their assessments
5. **cross-work-review**: Comparative analysis across works
6. **synthesis**: New scholar integrates perspectives
7. **opposition**: Loyal dissent challenges synthesis
8. **final-critique**: Critics assess synthesis
9. **convener-report**: Operational documentation
10. **recognition**: Honor all contributors

## Philosophy
- Quality over velocity (deep work takes time)
- Facilitation over command
- Beads track work; discourse emerges organically
"""
formula = "symposium"
version = 1

# Step definitions - each becomes a child bead when molecule is poured

[[steps]]
id = "phase-1"
title = "Phase 1: Independent Work"
description = """
Scholars write essays independently on the symposium topic.

Use spawn-scholar.sh for each scholar with the symposium bead ID.
Phase complete when all scholar beads are closed.
"""

[[steps]]
id = "phase-2"
title = "Phase 2: Independent Review"
needs = ["phase-1"]
description = """
Critics review all works from Phase 1.

Each critic reviews ALL essays. Use spawn-critic.sh with symposium bead ID.
Phase complete when all critic beads are closed.
"""

[[steps]]
id = "phase-3"
title = "Phase 3: Independent Revision"
needs = ["phase-2"]
description = """
Scholars revise based on reviews.

Each scholar receives their reviews and produces revised essay.
Phase complete when all revision beads are closed.
"""

[[steps]]
id = "phase-4"
title = "Phase 4: Cross-Review"
needs = ["phase-3"]
description = """
Critics compare their assessments.

Critics discuss where they converged/diverged in assessments.
Single bead for this phase (editorial board).
"""

[[steps]]
id = "phase-5"
title = "Phase 5: Cross-Work Review"
needs = ["phase-4"]
description = """
Comparative analysis across all works.

Identify points of agreement, disagreement, and synthesis opportunities.
Single bead for this phase.
"""

[[steps]]
id = "phase-6"
title = "Phase 6: Synthesis"
needs = ["phase-5"]
description = """
New scholar integrates perspectives.

Create unified framework stronger than any single approach.
Single bead for this phase.
"""

[[steps]]
id = "phase-7"
title = "Phase 7: Opposition"
needs = ["phase-6"]
description = """
Loyal opposition challenges synthesis.

Challenge conclusions, represent foreclosed perspectives.
Use spawn-opposition.sh with symposium bead ID.
"""

[[steps]]
id = "phase-8"
title = "Phase 8: Final Critique"
needs = ["phase-7"]
description = """
Critics assess synthesis in light of opposition.

Assess whether synthesis genuinely integrates perspectives.
One bead per critic reviewing.
"""

[[steps]]
id = "phase-9"
title = "Phase 9: Convener Report"
needs = ["phase-8"]
description = """
Convener documents the symposium.

Document workflow, timeline, costs, process improvements.
"""

[[steps]]
id = "phase-10"
title = "Phase 10: Recognition"
needs = ["phase-9"]
description = """
Honor all contributors.

- CONTRIBUTORS.md: Honor roll
- METRICS.md: Quantitative summary
- recognition-report.md: Narrative appreciation

Close symposium bead after this phase.
"""
