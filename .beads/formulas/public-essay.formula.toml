# Public Essay Formula
#
# A mini-symposium that produces a self-contained, public-facing essay
# from existing symposium outputs. Tests agent spawning and phase transitions.
#
# Usage:
#   bd cook public-essay
#   bd --no-daemon mol pour public-essay

description = """
Public Essay: 4-phase workflow to produce a self-contained essay for general audiences.

Takes symposium outputs and distills them into an accessible, polished essay
that stands alone without requiring readers to engage with the full discourse.

## Phases
1. **draft**: Scholar writes self-contained essay from symposium materials
2. **review**: Critic assesses clarity and accessibility
3. **revise**: Scholar addresses feedback
4. **polish**: Copyeditor refines prose, adds links, ensures publishability

## Philosophy
- Accessibility over academic rigor
- Self-contained (readers won't read the symposium)
- Public-facing (could be published externally)
"""
formula = "public-essay"
version = 1

[[steps]]
id = "draft"
title = "Phase 1: Draft Essay"
description = """
Write a self-contained essay for general audiences.

**Input**: Full symposium outputs (essays, synthesis, opposition)
**Output**: 2000-3000 word essay that:
- Explains the question and why it matters
- Presents key insights from the symposium
- Acknowledges tensions and disagreements
- Draws actionable conclusions
- Requires no prior reading

The reader should understand the topic fully from this essay alone.
"""

[[steps]]
id = "review"
title = "Phase 2: Review"
needs = ["draft"]
description = """
Assess the essay for clarity and accessibility.

**Focus areas**:
- Is it understandable without symposium context?
- Are technical concepts explained?
- Is the argument clear?
- Are there gaps a general reader would notice?
- Is it engaging?

Provide specific, actionable feedback.
"""

[[steps]]
id = "revise"
title = "Phase 3: Revise"
needs = ["review"]
description = """
Address reviewer feedback.

Revise the essay based on the review, focusing on:
- Clarity improvements
- Better explanations where needed
- Stronger engagement hooks
- Tighter argument structure
"""

[[steps]]
id = "polish"
title = "Phase 4: Polish"
needs = ["revise"]
description = """
Copyedit for publishability.

**Copyeditor tasks**:
- Prose refinement (flow, rhythm, word choice)
- Add relevant links to sources
- Check consistency (terminology, formatting)
- Ensure title and headers are compelling
- Final proofread

Output: Publication-ready essay.
"""
