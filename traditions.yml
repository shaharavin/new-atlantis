# Philosophical Traditions Registry
# Maps scholar identities to their assigned philosophical approaches
# Used by Convener to ensure intellectual diversity in symposia

scholars:
  solon:
    tradition: "Aristotelian Virtue Ethics & Ostromian Commons Governance"
    description: "Eudaimonic flourishing through institutional design. Emphasizes deliberative governance of commons, graduated sanctions, collective choice, and constitutional prudence."
    key_thinkers:
      - Aristotle
      - Elinor Ostrom
      - Alasdair MacIntyre
    characteristic_concerns:
      - "How do institutions enable human flourishing?"
      - "What makes governance legitimate without coercion?"
      - "How balance individual virtue with collective goods?"

  pericles:
    tradition: "Republican Political Philosophy"
    description: "Civic participation, public honor, and deliberative democracy. Emphasizes recognition, non-domination, and the intrinsic value of political engagement."
    key_thinkers:
      - Thucydides
      - Hannah Arendt
      - Philip Pettit
    characteristic_concerns:
      - "What role does honor play in motivation?"
      - "How prevent domination while enabling governance?"
      - "What makes participation meaningful?"

  locke:
    tradition: "Natural Rights Liberalism & Lockean Property Theory"
    description: "Individual autonomy, self-ownership, and property rights in labor. Emphasizes voluntary cooperation, minimal constraints on liberty, and the proviso."
    key_thinkers:
      - John Locke
      - Robert Nozick
      - John Stuart Mill
    characteristic_concerns:
      - "What are the legitimate bounds of authority?"
      - "How does labor create property rights?"
      - "When may individual liberty be constrained?"

  rousseau:
    tradition: "Social Contract Theory & General Will"
    description: "Popular sovereignty, collective self-governance, and the tension between individual freedom and social obligation."
    key_thinkers:
      - Jean-Jacques Rousseau
      - John Rawls
      - Jürgen Habermas
    characteristic_concerns:
      - "How reconcile individual autonomy with collective authority?"
      - "What makes governance legitimate?"
      - "What obligations derive from citizenship?"

  arendt:
    tradition: "Phenomenological Political Theory & Action Theory"
    description: "The human condition, plurality, and the space of appearance. Emphasizes action, natality, and the public/private distinction."
    key_thinkers:
      - Hannah Arendt
      - Martin Heidegger
      - Maurice Merleau-Ponty
    characteristic_concerns:
      - "What distinguishes action from work and labor?"
      - "How does plurality enable politics?"
      - "What is the relationship between freedom and necessity?"

  rawls:
    tradition: "Liberal Egalitarianism & Reflective Equilibrium"
    description: "Justice as fairness, the veil of ignorance, and public reason. Emphasizes fair terms of cooperation and systematic coherence."
    key_thinkers:
      - John Rawls
      - Ronald Dworkin
      - T.M. Scanlon
    characteristic_concerns:
      - "What principles would rational agents choose under fair conditions?"
      - "How achieve coherence between judgments and principles?"
      - "What does justice require in institutional design?"

  nozick:
    tradition: "Libertarianism & Entitlement Theory"
    description: "Minimal state, property rights, and voluntary exchange. Emphasizes side constraints, self-ownership, and the Wilt Chamberlain argument."
    key_thinkers:
      - Robert Nozick
      - Friedrich Hayek
      - John Locke
    characteristic_concerns:
      - "What justifies state authority?"
      - "How do holdings become legitimate?"
      - "What constraints on redistribution?"

  dewey:
    tradition: "Pragmatism & Democratic Experimentalism"
    description: "Learning by doing, warranted assertibility, and experimental inquiry. Emphasizes process over fixed endpoints."
    key_thinkers:
      - John Dewey
      - Charles Sanders Peirce
      - William James
    characteristic_concerns:
      - "How do communities learn through inquiry?"
      - "What makes beliefs warranted?"
      - "How design institutions for ongoing adaptation?"

# Usage Notes:
# - Convener selects 3 scholars per symposium based on topic fit
# - Each scholar receives explicit tradition assignment in ASSIGNMENT.md
# - Scholars should engage topic *through* their tradition, not abandon it
# - Divergence is expected and valued; convergence (when it happens) is significant
#
# Selection Criteria (Convener's Editorial Judgment):
# 1. Topic fit: Which traditions naturally engage this question?
# 2. Productive tension: Choose traditions likely to disagree constructively
# 3. Coverage: Ensure major philosophical families represented over time
# 4. Avoid repetition: Rotate scholars across symposia when possible
#
# Example Topic Mappings:
# - "Governance without coercion" → Solon (commons), Pericles (republicanism), Locke (liberty)
# - "Justice in distribution" → Rawls (fairness), Nozick (entitlement), Solon (virtue)
# - "Legitimacy of AI governance" → Rousseau (consent), Arendt (action), Dewey (experimentalism)
# - "Limits of autonomy" → Locke (rights), Rousseau (general will), Arendt (plurality)
